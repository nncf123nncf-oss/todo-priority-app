<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>優先度つきTodoアプリ</title>
  <link rel="stylesheet" href="style.css">
    <style>
  /* --- 運営者表記フッタ（全Day共通・Day037と同一仕様） -------------------
     ページごとに配色が違うため、ページ側のCSS変数に依存せず自己完結させる。
     ツール本体のスタイルには触れない。印刷時は表示しない。 */
  .mw-footer {
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    margin: 24px 0 0;
    padding: 16px;
    background: #F7F7F8;
    border: 1px solid #D8D8DC;
    border-radius: 6px;
    color: #3A3A3E;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.7;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .mw-footer p { margin: 0 0 6px; padding: 0; color: #3A3A3E; font-size: 12px; font-weight: 400; line-height: 1.7; text-align: left; }
  .mw-footer p:last-child { margin-bottom: 0; }
  .mw-footer a { color: #0B5AA6; }
  .mw-footer.mw-footer--page { width: calc(100% - 32px); max-width: 720px; margin: 24px auto; }
  @media print { .mw-footer { display: none; } }
    </style>
</head>
<body>
  <main class="container">
    <h1 class="app-title">📋 優先度つきTodo</h1>

    <form id="task-form" class="task-form" autocomplete="off">
      <div class="form-row">
        <label class="field field-name">
          <span class="field-label">タスク名</span>
          <input type="text" id="task-name" placeholder="例：レポート提出" maxlength="100">
        </label>
        <label class="field">
          <span class="field-label">期限</span>
          <input type="date" id="task-due">
        </label>
        <label class="field">
          <span class="field-label">優先度</span>
          <select id="task-priority">
            <option value="high">高</option>
            <option value="medium" selected>中</option>
            <option value="low">低</option>
          </select>
        </label>
      </div>
      <p id="form-error" class="form-error" hidden>タスク名を入力してください</p>
      <button type="submit" class="add-btn">＋ 追加</button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty-message" hidden>タスクがありません。上のフォームから追加してください。</p>
  <footer class="mw-footer">
    <p>みちAIワークス（MICHI AI WORKS）／代表 田中　泉</p>
    <p>運営: <a href="https://michi-portfolio.vercel.app/" rel="noopener">みちAIワークス 公式サイト</a>（https://michi-portfolio.vercel.app/ ）／ お問い合わせ: <a href="mailto:nncf123nncf@gmail.com">nncf123nncf@gmail.com</a></p>
    <p>このツールはブラウザの中だけで動きます。入力した内容はこのブラウザの中にのみ保存され、外部への送信・収集は一切行いません。</p>
    <p>ログイン・会員登録・パスワードの入力を求めることはありません。</p>
  </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
