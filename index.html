<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>優先度つきTodoアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="app-title">📋 優先度つきTodo</h1>

    <form id="task-form" class="task-form" autocomplete="off">
      <div class="form-row">
        <label class="field field-name">
          <span class="field-label">タスク名</span>
          <input type="text" id="task-name" placeholder="例：レポート提出" maxlength="100">
        </label>
        <label class="field">
          <span class="field-label">期限</span>
          <input type="date" id="task-due">
        </label>
        <label class="field">
          <span class="field-label">優先度</span>
          <select id="task-priority">
            <option value="high">高</option>
            <option value="medium" selected>中</option>
            <option value="low">低</option>
          </select>
        </label>
      </div>
      <p id="form-error" class="form-error" hidden>タスク名を入力してください</p>
      <button type="submit" class="add-btn">＋ 追加</button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty-message" hidden>タスクがありません。上のフォームから追加してください。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
